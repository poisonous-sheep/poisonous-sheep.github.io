baseURL = "https://poisonous-sheep.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "小羊的博客！"
theme = "hugo-theme-stack"

[pagination]
pagerSize = 6

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[params]
mainSections = ["post"]
featuredImageField = "image"
rssFullContent = true
favicon = "/favicon.ico"

[params.footer]
since = 2025
customText = "小羊的发癫地方（划掉） · Liquid Glass × Teto 🥖"

[params.dateFormat]
published = "2006-01-02"
lastUpdated = "2006-01-02 15:04"

[params.sidebar]
emoji = "🐑"
subtitle = "游戏 + 学习 + 术力口！"
compact = false

[params.sidebar.avatar]
enabled = true
local = true
src = "img/avatar.png"

[params.article]
math = true
toc = true
readingTime = true
license = { enabled = false }

[params.colorScheme]
toggle = true
default = "auto"

[params.widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
  { type = "categories", params = { limit = 10 } },
  { type = "tag-cloud", params = { limit = 12 } }
]
page = [
  { type = "toc" }
]

# 网易云音乐播放器配置（把 id 换成你的网易云歌单 ID 即可）
[params.music]
enabled = true
server = "netease"
type = "playlist"
id = "24381616"
fixed = true
autoplay = false
order = "random"

# 重音 Teto 看板娘配置
[params.teto]
enabled = true

# 左侧社交图标
[[menu.social]]
identifier = "bilibili"
name = "Bilibili"
url = "https://space.bilibili.com/344309611"
[menu.social.params]
icon = "brand-bilibili"

[[menu.social]]
identifier = "qq"
name = "QQ 空间"
url = "https://user.qzone.qq.com/3533382348/main"
[menu.social.params]
icon = "messages"

[[menu.social]]
identifier = "github"
name = "GitHub"
url = "https://github.com/poisonous-sheep"
[menu.social.params]
icon = "brand-github"

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = true
tabWidth = 4
