{{- if .Site.Params.music.enabled -}}
<!-- 网易云音乐播放器（APlayer + MetingJS） -->
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js" defer></script>
<meting-js
    server="{{ .Site.Params.music.server | default "netease" }}"
    type="{{ .Site.Params.music.type | default "playlist" }}"
    id="{{ .Site.Params.music.id }}"
    fixed="{{ .Site.Params.music.fixed | default true }}"
    autoplay="{{ .Site.Params.music.autoplay | default false }}"
    order="{{ .Site.Params.music.order | default "random" }}"
    theme="#e63956"
    lrc-type="0">
</meting-js>
{{- end -}}

{{- if .Site.Params.teto.enabled -}}
<!-- 重音 Teto 看板娘 -->
<div id="teto-mascot" aria-label="重音 Teto 看板娘">
    <div id="teto-bubble">君は実に馬鹿だな~ 今天 AC 了吗？🥖</div>
    <button id="teto-avatar-btn" type="button" title="点我和 Teto 互动！">
        <span class="teto-emoji">🎀</span>
        <span class="teto-name">TETO</span>
    </button>
</div>
<script>
(function () {
    var lines = [
        "君は実に馬鹿だな~ 今天 AC 了吗？🥖",
        "法棍能量注入！单调队列秒了！",
        "第五人格启动！今天不溜鬼不睡觉！🎮",
        "来听一首术力口再写题吧 🎵",
        "双马尾钻头启动！图论最短路别写挂啦！",
        "小羊的发癫地方欢迎你 🐑✨"
    ];
    var idx = 0;
    var btn = document.getElementById("teto-avatar-btn");
    var bubble = document.getElementById("teto-bubble");
    if (!btn || !bubble) return;
    btn.addEventListener("click", function () {
        idx = (idx + 1) % lines.length;
        bubble.style.opacity = "0";
        bubble.style.transform = "translateY(4px)";
        setTimeout(function () {
            bubble.textContent = lines[idx];
            bubble.style.opacity = "1";
            bubble.style.transform = "translateY(0)";
        }, 160);
    });
})();
</script>
{{- end -}}
