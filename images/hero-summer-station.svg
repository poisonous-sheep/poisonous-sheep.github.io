<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="五点半的临海无人站">
  <defs>
    <linearGradient id="hs-sky" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#2E86C1"/>
      <stop offset="34%" stop-color="#64B5E5"/>
      <stop offset="68%" stop-color="#BCE2F8"/>
      <stop offset="88%" stop-color="#EAF5FC"/>
      <stop offset="100%" stop-color="#FCECE2"/>
    </linearGradient>
    <linearGradient id="hs-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CA7D6"/>
      <stop offset="45%" stop-color="#3B82B6"/>
      <stop offset="100%" stop-color="#245B8A"/>
    </linearGradient>
    <linearGradient id="hs-cloud-light" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F5FAFE"/>
      <stop offset="100%" stop-color="#CEE3F2"/>
    </linearGradient>
    <linearGradient id="hs-cloud-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2E5F4"/>
      <stop offset="100%" stop-color="#9BC1DF"/>
    </linearGradient>
    <linearGradient id="hs-sunbeam" x1="0.85" y1="0.1" x2="0.2" y2="0.95">
      <stop offset="0%" stop-color="#FFF9EE" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hs-platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE4EC"/>
      <stop offset="100%" stop-color="#B9C7D4"/>
    </linearGradient>
    <filter id="hs-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="hs-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- 澄澈夏空 -->
  <rect width="1200" height="900" fill="url(#hs-sky)"/>

  <!-- 高空柔光日晕 -->
  <circle cx="965" cy="185" r="140" fill="#FFFDF5" opacity="0.32" filter="url(#hs-glow)"/>
  <circle cx="965" cy="185" r="46" fill="#FFFFFF" opacity="0.72" filter="url(#hs-soft)"/>
  <polygon points="820,0 1200,0 1200,320 420,900 120,900" fill="url(#hs-sunbeam)"/>

  <!-- 远处薄卷云 -->
  <g fill="#FFFFFF" opacity="0.42" filter="url(#hs-soft)">
    <ellipse cx="260" cy="135" rx="185" ry="14" transform="rotate(-6 260 135)"/>
    <ellipse cx="620" cy="105" rx="140" ry="10" transform="rotate(-3 620 105)"/>
  </g>

  <!-- 巨型立体入道云（阴影层） -->
  <g fill="url(#hs-cloud-shadow)" opacity="0.88">
    <circle cx="515" cy="445" r="108"/>
    <circle cx="635" cy="395" r="132"/>
    <circle cx="758" cy="435" r="115"/>
    <circle cx="870" cy="475" r="95"/>
    <circle cx="400" cy="485" r="88"/>
    <rect x="330" y="470" width="635" height="125" rx="45"/>
  </g>

  <!-- 巨型立体入道云（高光受光层） -->
  <g fill="url(#hs-cloud-light)">
    <circle cx="642" cy="312" r="92"/>
    <circle cx="578" cy="378" r="88"/>
    <circle cx="716" cy="368" r="96"/>
    <circle cx="508" cy="435" r="76"/>
    <circle cx="798" cy="422" r="84"/>
    <circle cx="888" cy="466" r="68"/>
    <circle cx="424" cy="478" r="62"/>
    <ellipse cx="650" cy="490" rx="280" ry="62"/>
  </g>

  <!-- 右侧零星夏云 -->
  <g fill="#FFFFFF" opacity="0.86">
    <circle cx="1050" cy="492" r="46"/>
    <circle cx="1102" cy="482" r="56"/>
    <circle cx="1155" cy="500" r="42"/>
  </g>

  <!-- 远处半岛剪影 -->
  <path d="M0 578 Q 160 558, 325 572 T 560 584 L560 600 L0 600 Z" fill="#6F9EC2" opacity="0.55"/>
  <path d="M890 584 Q 1030 562, 1200 576 L1200 600 L890 600 Z" fill="#6A9AC0" opacity="0.48"/>

  <!-- 闪光海面 -->
  <rect x="0" y="586" width="1200" height="145" fill="url(#hs-sea)"/>
  <line x1="0" y1="586" x2="1200" y2="586" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- 海面细碎日光波纹 -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="870" y1="600" x2="995" y2="600" stroke-width="2" opacity="0.72"/>
    <line x1="905" y1="612" x2="1030" y2="612" stroke-width="1.8" opacity="0.58"/>
    <line x1="850" y1="624" x2="965" y2="624" stroke-width="1.6" opacity="0.52"/>
    <line x1="920" y1="638" x2="1010" y2="638" stroke-width="1.4" opacity="0.45"/>
    <line x1="520" y1="608" x2="610" y2="608" stroke-width="1.2" opacity="0.34"/>
    <line x1="340" y1="620" x2="410" y2="620" stroke-width="1.2" opacity="0.28"/>
    <line x1="740" y1="648" x2="835" y2="648" stroke-width="1.4" opacity="0.38"/>
    <line x1="955" y1="658" x2="1045" y2="658" stroke-width="1.6" opacity="0.4"/>
  </g>

  <!-- 海鸟点缀 -->
  <g fill="none" stroke="#2C4E6C" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <path d="M440 245 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M482 268 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M810 218 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <!-- 无人车站护栏与铁轨远景 -->
  <g stroke="#29435C" stroke-linecap="round">
    <line x1="0" y1="684" x2="1200" y2="684" stroke-width="3.5" opacity="0.82"/>
    <line x1="0" y1="712" x2="1200" y2="712" stroke-width="2.2" opacity="0.65"/>
    <g stroke-width="3" opacity="0.78">
      <line x1="90" y1="678" x2="90" y2="748"/>
      <line x1="250" y1="678" x2="250" y2="748"/>
      <line x1="410" y1="678" x2="410" y2="748"/>
      <line x1="570" y1="678" x2="570" y2="748"/>
      <line x1="730" y1="678" x2="730" y2="748"/>
      <line x1="890" y1="678" x2="890" y2="748"/>
      <line x1="1050" y1="678" x2="1050" y2="748"/>
    </g>
  </g>

  <!-- 站台地面与盲道黄线 -->
  <polygon points="0,735 1200,722 1200,900 0,900" fill="url(#hs-platform)"/>
  <polygon points="0,735 1200,722 1200,736 0,750" fill="#8FA3B5"/>
  <polygon points="0,782 1200,765 1200,777 0,796" fill="#E6C36B" opacity="0.82"/>
  <!-- 站台透视缝线 -->
  <g stroke="#92A6B8" stroke-width="1.2" opacity="0.55">
    <line x1="220" y1="744" x2="90" y2="900"/>
    <line x1="540" y1="738" x2="465" y2="900"/>
    <line x1="860" y1="732" x2="880" y2="900"/>
  </g>

  <!-- 左侧日系候车棚檐角 -->
  <g>
    <polygon points="0,210 385,295 362,324 0,256" fill="#1E344B"/>
    <polygon points="0,256 362,324 352,338 0,275" fill="#3B5B78"/>
    <rect x="64" y="274" width="14" height="495" fill="#223A52"/>
    <rect x="296" y="318" width="11" height="445" fill="#294560"/>
    <!-- 站台白底蓝边站名牌 -->
    <g transform="translate(115, 392)">
      <rect x="0" y="0" width="154" height="72" rx="4" fill="#F8FBFE" stroke="#2D5A80" stroke-width="2.5"/>
      <rect x="0" y="50" width="154" height="10" fill="#348AC7"/>
      <text x="77" y="35" text-anchor="middle" fill="#1E2D3D" font-size="22" font-family="serif" letter-spacing="6">夏末駅</text>
      <text x="77" y="67" text-anchor="middle" fill="#647A8F" font-size="8.5" font-family="monospace" letter-spacing="2">NATSUMATSU</text>
    </g>
    <!-- 木质候车长椅 -->
    <g transform="translate(105, 650)">
      <rect x="0" y="14" width="168" height="12" rx="2" fill="#8C6B54"/>
      <rect x="0" y="34" width="168" height="10" rx="2" fill="#A07D63"/>
      <rect x="18" y="44" width="8" height="42" fill="#374C61"/>
      <rect x="142" y="44" width="8" height="42" fill="#374C61"/>
    </g>
  </g>

  <!-- 右侧细长木质电线杆、瓷瓶与斜拉电线 -->
  <g stroke="#1C2E40" fill="none">
    <line x1="948" y1="88" x2="968" y2="758" stroke-width="10" stroke-linecap="round" opacity="0.88"/>
    <line x1="888" y1="146" x2="1014" y2="146" stroke-width="6" stroke-linecap="round" opacity="0.86"/>
    <line x1="896" y1="202" x2="1008" y2="202" stroke-width="5" stroke-linecap="round" opacity="0.84"/>
    <line x1="910" y1="146" x2="952" y2="188" stroke-width="2.5" opacity="0.72"/>
    <line x1="992" y1="146" x2="952" y2="188" stroke-width="2.5" opacity="0.72"/>
    <!-- 陶瓷绝缘子 -->
    <g fill="#EBF4FA" stroke="#22364A" stroke-width="1.5">
      <rect x="898" y="136" width="8" height="10" rx="2"/>
      <rect x="922" y="136" width="8" height="10" rx="2"/>
      <rect x="974" y="136" width="8" height="10" rx="2"/>
      <rect x="998" y="136" width="8" height="10" rx="2"/>
    </g>
    <!-- 划过天空的五线谱般电线 -->
    <path d="M0 112 Q 465 215, 902 141 T 1200 116" stroke-width="1.6" opacity="0.58"/>
    <path d="M0 156 Q 485 258, 926 141 T 1200 132" stroke-width="1.4" opacity="0.5"/>
    <path d="M0 198 Q 515 292, 978 202 T 1200 184" stroke-width="1.25" opacity="0.44"/>
    <path d="M0 242 Q 520 330, 1002 202 T 1200 218" stroke-width="1.1" opacity="0.35"/>
  </g>
</svg>
