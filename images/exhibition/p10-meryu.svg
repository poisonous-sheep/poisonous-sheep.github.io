<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="nightM" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#050D23"/>
      <stop offset="52%" stop-color="#0B1E48"/>
      <stop offset="100%" stop-color="#173469"/>
    </linearGradient>
    <radialGradient id="lampHalo" cx="0.5" cy="0.24" r="0.46">
      <stop offset="0%" stop-color="#FFFCE3" stop-opacity="0.98"/>
      <stop offset="18%" stop-color="#F6E59F" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#76A7E6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B1E48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampBeam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFF5C8" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#BFD6F7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0B1E48" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Midnight Sky -->
  <rect width="1200" height="800" fill="url(#nightM)"/>
  <rect width="1200" height="800" fill="url(#lampHalo)"/>

  <!-- Fine Summer Starfield -->
  <g fill="#F4F8FF">
    <circle cx="142" cy="112" r="1.4" opacity="0.65"/>
    <circle cx="268" cy="186" r="1.1" opacity="0.48"/>
    <circle cx="388" cy="94" r="1.6" opacity="0.72"/>
    <circle cx="842" cy="118" r="1.4" opacity="0.62"/>
    <circle cx="964" cy="194" r="1.8" opacity="0.78"/>
    <circle cx="1062" cy="92" r="1.2" opacity="0.5"/>
    <circle cx="1018" cy="288" r="1.3" opacity="0.42"/>
  </g>

  <!-- Delicate Crescent Moon -->
  <path d="M976 116 A34 34 0 1 0 1018 164 A27 27 0 1 1 976 116 Z" fill="#FBF5CF" opacity="0.88"/>

  <!-- Crossing Night Wires -->
  <g stroke="#5F87C4" stroke-opacity="0.3" stroke-width="1.2">
    <path d="M0 162 Q 460 245, 1200 132"/>
    <path d="M0 210 Q 520 294, 1200 184"/>
  </g>

  <!-- Streetlamp Light Cone & Steel Post -->
  <polygon points="578,196 622,196 860,800 340,800" fill="url(#lampBeam)"/>
  <g>
    <rect x="595" y="200" width="10" height="600" fill="#07112B"/>
    <path d="M562 204 C562 184, 638 184, 638 204 Z" fill="#10214A" stroke="#76A2DD" stroke-opacity="0.45"/>
    <ellipse cx="600" cy="208" rx="18" ry="8" fill="#FFFBE0" filter="url(#glowM)"/>
  </g>

  <!-- Rooftop / Eaves Silhouette -->
  <polygon points="0,715 320,664 360,800 0,800" fill="#060E24"/>
  <polygon points="840,680 1200,722 1200,800 810,800" fill="#060E24"/>

  <!-- Hydrangea / Viburnum "Meryu" White Blossoms Glowing Softly Below -->
  <g opacity="0.85">
    <g fill="#D7E9FF" stroke="#8FB8EE" stroke-opacity="0.45" stroke-width="0.9">
      <circle cx="484" cy="656" r="14"/><circle cx="504" cy="642" r="16"/><circle cx="524" cy="658" r="14"/>
      <circle cx="496" cy="672" r="15"/><circle cx="516" cy="674" r="13"/>
      <circle cx="678" cy="648" r="15"/><circle cx="700" cy="634" r="17"/><circle cx="722" cy="648" r="15"/>
      <circle cx="690" cy="666" r="14"/><circle cx="712" cy="668" r="13"/>
    </g>
    <g stroke="#294F86" stroke-width="2">
      <line x1="504" y1="680" x2="496" y2="800"/>
      <line x1="702" y1="674" x2="710" y2="800"/>
    </g>
  </g>

  <!-- Drifting Luminous Petals / Ash Snow -->
  <g fill="#FBF9EC" filter="url(#glowM)">
    <circle cx="522" cy="292" r="3.4" opacity="0.82"/>
    <circle cx="648" cy="316" r="2.8" opacity="0.75"/>
    <circle cx="574" cy="390" r="4" opacity="0.86"/>
    <circle cx="662" cy="438" r="3.2" opacity="0.65"/>
    <circle cx="494" cy="480" r="2.5" opacity="0.58"/>
    <circle cx="614" cy="526" r="3.6" opacity="0.78"/>
    <circle cx="724" cy="542" r="2.2" opacity="0.48"/>
    <circle cx="446" cy="586" r="2.6" opacity="0.42"/>
  </g>

  <!-- Dual Credit Archival Plaque -->
  <g transform="translate(42, 38)">
    <rect width="372" height="62" rx="12" fill="#061029" fill-opacity="0.72" stroke="#8AC2F5" stroke-opacity="0.34"/>
    <text x="18" y="25" font-family="'Shippori Mincho', 'Noto Serif SC', serif" font-size="16" fill="#FBF9EF" letter-spacing="2">メリュー · MERYU</text>
    <text x="18" y="47" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A9C8ED" letter-spacing="1">PV: あわしま · 8/14 贺图: にし (@ness3_0427)</text>
  </g>
</svg>
