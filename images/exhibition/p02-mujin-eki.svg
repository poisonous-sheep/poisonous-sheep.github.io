<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#193A78"/>
      <stop offset="34%" stop-color="#4A7EC7"/>
      <stop offset="68%" stop-color="#E79C8E"/>
      <stop offset="100%" stop-color="#F7D59C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.68" cy="0.62" r="0.42">
      <stop offset="0%" stop-color="#FFF9DF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFD49A" stop-opacity="0.58"/>
      <stop offset="72%" stop-color="#E67D73" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#193A78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C87E84"/>
      <stop offset="35%" stop-color="#4A6B9F"/>
      <stop offset="100%" stop-color="#15284E"/>
    </linearGradient>
    <linearGradient id="platformConcrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283552"/>
      <stop offset="100%" stop-color="#151E34"/>
    </linearGradient>
    <linearGradient id="cloudLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#F6D0BF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#7693C2" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tinyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dusk Sky & Golden Horizon -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="620" fill="url(#sunGlow)"/>

  <!-- Towering Late-Summer Cumulus Clouds -->
  <g opacity="0.88">
    <path d="M-20 455 C40 390, 120 385, 175 415 C205 350, 295 340, 345 385 C395 310, 505 315, 550 380 C610 355, 680 390, 710 430 L710 520 L-20 520 Z" fill="url(#cloudLit)"/>
    <path d="M770 435 C820 375, 910 365, 965 395 C1015 340, 1110 345, 1155 390 C1185 370, 1210 385, 1220 410 L1220 520 L770 520 Z" fill="url(#cloudLit)" opacity="0.78"/>
  </g>

  <!-- Setting Sun & Sea -->
  <circle cx="816" cy="496" r="44" fill="#FFF7DA" opacity="0.86" filter="url(#softBlur)"/>
  <circle cx="816" cy="496" r="26" fill="#FFFDF4"/>
  <rect x="0" y="512" width="1200" height="140" fill="url(#seaGrad)"/>

  <!-- Shimmering Sea Reflection -->
  <g fill="#FFE8BC" opacity="0.58">
    <rect x="768" y="520" width="96" height="3" rx="1.5"/>
    <rect x="752" y="531" width="128" height="3" rx="1.5" opacity="0.8"/>
    <rect x="776" y="544" width="84" height="2.5" rx="1.2" opacity="0.72"/>
    <rect x="738" y="558" width="144" height="3" rx="1.5" opacity="0.55"/>
    <rect x="765" y="574" width="102" height="2.5" rx="1.2" opacity="0.42"/>
    <rect x="784" y="592" width="66" height="2" rx="1" opacity="0.34"/>
  </g>

  <!-- Distant Coastal Peninsula -->
  <path d="M0 512 L190 486 L340 498 L455 512 Z" fill="#2A3E68" opacity="0.72"/>
  <path d="M980 512 L1085 492 L1200 480 L1200 512 Z" fill="#23335A" opacity="0.8"/>

  <!-- Railway Track Bed & Perspective Rails -->
  <polygon points="0,636 1200,598 1200,800 0,800" fill="#10182C"/>
  <path d="M0 658 L1200 612" stroke="#53688F" stroke-width="4.5"/>
  <path d="M0 680 L1200 622" stroke="#7A8BAE" stroke-width="2.2" opacity="0.75"/>
  <path d="M0 714 L1200 644" stroke="#E0A583" stroke-width="2" opacity="0.52"/>

  <!-- Platform Edge (Perspective) -->
  <polygon points="0,584 740,564 690,800 0,800" fill="url(#platformConcrete)"/>
  <line x1="0" y1="584" x2="740" y2="564" stroke="#E9B28B" stroke-width="3" opacity="0.82"/>
  <line x1="0" y1="595" x2="736" y2="574" stroke="#D9A852" stroke-width="4" stroke-dasharray="16 6" opacity="0.78"/>

  <!-- Utility Pole & Overhead Catenary Wires -->
  <g stroke="#1B2846" stroke-linecap="round">
    <rect x="148" y="138" width="10" height="456" fill="#17233F"/>
    <rect x="116" y="178" width="76" height="6" rx="2" fill="#17233F"/>
    <rect x="122" y="218" width="64" height="5" rx="2" fill="#17233F"/>
    <rect x="574" y="294" width="6" height="275" fill="#1E2C4D"/>
    <rect x="556" y="314" width="44" height="4" rx="1.5" fill="#1E2C4D"/>
  </g>
  <g stroke="#243760" stroke-width="1.35" opacity="0.78">
    <path d="M0 162 Q 75 182, 148 178 Q 370 258, 574 314 Q 880 390, 1200 434"/>
    <path d="M0 198 Q 75 216, 148 218 Q 370 282, 574 326 Q 880 398, 1200 442"/>
    <path d="M188 180 Q 410 264, 598 315 Q 890 388, 1200 426"/>
    <path d="M0 244 Q 250 302, 574 344 Q 885 408, 1200 456" stroke-width="0.9" opacity="0.55"/>
  </g>

  <!-- Unattended Wooden Platform Roof & Bench -->
  <g>
    <polygon points="48,430 412,414 438,432 32,452" fill="#17223B"/>
    <rect x="78" y="446" width="8" height="148" fill="#1B2742"/>
    <rect x="368" y="428" width="8" height="154" fill="#1B2742"/>
    <!-- Empty Wooden Bench -->
    <rect x="136" y="544" width="168" height="10" rx="2" fill="#8E6352"/>
    <rect x="136" y="558" width="168" height="8" rx="2" fill="#775142"/>
    <rect x="132" y="574" width="176" height="9" rx="2" fill="#9E715D"/>
    <rect x="150" y="583" width="8" height="28" fill="#2A344D"/>
    <rect x="282" y="583" width="8" height="28" fill="#2A344D"/>
  </g>

  <!-- Classic Japanese Station Nameplate Sign: 無人駅 -->
  <g transform="translate(428, 434)">
    <rect x="52" y="64" width="5" height="72" fill="#253457"/>
    <rect x="132" y="64" width="5" height="72" fill="#253457"/>
    <rect x="0" y="0" width="190" height="74" rx="5" fill="#FBF7EC" stroke="#253457" stroke-width="3"/>
    <rect x="0" y="52" width="190" height="22" rx="0 0 3 3" fill="#2A5EA8"/>
    <text x="95" y="34" text-anchor="middle" font-family="'Shippori Mincho', 'Noto Serif SC', serif" font-size="25" font-weight="600" fill="#16294F" letter-spacing="6">無人駅</text>
    <text x="95" y="67" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#FBF7EC" letter-spacing="2.4">MUJIN-EKI · PV HOMAGE</text>
  </g>

  <!-- Glowing Railway Signal Lamp & Summer Dust Motes -->
  <g filter="url(#tinyGlow)">
    <circle cx="595" cy="348" r="5" fill="#F6D98B"/>
    <circle cx="242" cy="390" r="2.2" fill="#FFF4D2" opacity="0.8"/>
    <circle cx="318" cy="462" r="1.8" fill="#FFF4D2" opacity="0.65"/>
    <circle cx="678" cy="422" r="2.5" fill="#FFE6B2" opacity="0.72"/>
    <circle cx="742" cy="468" r="1.8" fill="#FFE6B2" opacity="0.58"/>
  </g>

  <!-- Editorial Gallery Plate Stamp -->
  <g opacity="0.82">
    <rect x="36" y="34" width="174" height="32" rx="16" fill="#0B1836" fill-opacity="0.48" stroke="#FBF7EC" stroke-opacity="0.35"/>
    <text x="123" y="54" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#FAF6EA" letter-spacing="2">P02 · MUJIN-EKI · 17:42</text>
  </g>
</svg>
